name: storyloom
description: Private character and story workspace for Windows and Android.
publish_to: none
version: 0.8.3+11
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^10.3.10
  desktop_drop: ^0.8.4
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.0.0
  uuid: ^4.5.1
  flutter_quill:
    path: third_party/flutter_quill
  http: ^1.6.0
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/emoji/catalog.json
    - assets/emoji/LICENSE.txt
    - assets/fonts/NotoEmoji-LICENSE.txt
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
